[project]
name = "alipay-devtools-mcp"
version = "0.1.0"
description = "MCP server for the Alipay Mini Program IDE (小程序开发者工具) — 对标 wechat-devtools-mcp"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "websockets>=13.0",
    "pillow>=10.0",
]

[project.scripts]
alipay-devtools = "alipay_devtools.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alipay_devtools"]
